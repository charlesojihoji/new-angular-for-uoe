<div class="container mb-5">
  <h1>Welcome to the Faculty Dashboard</h1>
  <p>This is where you can find all the courses and students.</p>
 
  <app-card class="mb-3" title="All Courses">
    <div class="row">
      @for(c of courses; track c.courseid){
        <div class="col-md-4">
            <course-card [course]="c"></course-card>
        </div>
      }
    </div>
  </app-card>
  <div class="row">
    <div class="col-md-12">
      <app-card title="All Students">
        <div class="row">
          @for(s of students; track s.id){
            <div class="col-md-4 text-center">
                <student-card [student]="s"></student-card>
            </div>
          }
        </div>
      </app-card>
    </div>
